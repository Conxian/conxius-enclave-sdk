[package]
name = "conxius-enclave-sdk"
version = "2.0.17"
license = "MIT"
rust-version = "1.97.1"
edition = "2021"
description = "Hardware-backed security primitives for the broader Conxian ecosystem. Provides high-integrity root of trust for security-sensitive wallet, signing, attestation, and policy flows."
documentation = "https://docs.rs/conxius-enclave-sdk"
homepage = "https://github.com/Conxian/conxius-enclave-sdk"
repository = "https://github.com/Conxian/conxius-enclave-sdk"

[features]
default = []
# Software-backed drivers are available only through an explicitly named
# development boundary and are never the default release surface.
development-simulators = []
mock-cloud-enclave = ["development-simulators"]
bip110_compliant = []
# PKCS#11 HSM/TPM integration via rust-cryptoki.
# Gate value-bearing PKCS#11 operations. Without this feature,
# Pkcs11Verifier methods return ProtocolUnsupported.
cryptoki = ["dep:cryptoki"]
# WebAuthn/FIDO2 attestation via webauthn-rs.
# Gate value-bearing WebAuthn operations. Without this feature,
# WebauthnVerifier methods return ProtocolUnsupported for attestation.
webauthn = ["dep:webauthn-rs"]
# FROST threshold signing backed by ZF FROST (frost-secp256k1-tr v3.0.0).
# Gates value-bearing FROST operations. Without this feature, FROST
# boundary types validate structurally but return ProtocolUnsupported
# for all cryptographic execution paths.
frost-crypto = ["frost-secp256k1-tr", "rand_core06"]
# Groth16/BitVM2 SNARK proof verification backed by BLS12-381 pairings.
# Gates value-bearing Groth16 verification. Without this feature,
# BitVm2Groth16Verifier returns VerificationUnavailable (fail closed).
groth16 = ["dep:bls12_381"]
# Fedimint e-cash blinding + Chaum-Pedersen DLEQ verification backed by
# BLS12-381 G1 arithmetic. Gates value-bearing Fedimint mint operations.
# Without this feature, Fedimint boundary types validate structurally but
# return ProtocolUnsupported for all cryptographic execution paths.
fedimint-crypto = ["dep:bls12_381"]

[dependencies]
x509-cert = "0.3.0"
der = { version = "0.8.1", features = ["alloc"] }
zeroize = { version = "1.8.1", features = ["derive", "zeroize_derive"] }
async-trait = "0.1.89"
aes = "0.9.1"
aes-gcm = "0.11.0"
bdk_wallet = { version = "3.1.0", default-features = false, features = ["std"] }
bitcoin = { version = "0.32.102", features = ["std", "rand"] }
lightning-invoice = { version = "0.34.1", default-features = false }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
hex = "0.4.3"
hmac = "0.13.0"
js-sys = "0.3.102"
k256 = "0.14.0"
ed25519-dalek = "3.0.0"
musig2 = "0.4.1"
frost-secp256k1-tr = { git = "https://github.com/ZcashFoundation/frost", tag = "frost-secp256k1-tr/v3.0.0", version = "3.0.0", optional = true }
# ZF FROST v3.0.0 uses rand_core 0.6. Provide a compatible RNG source.
rand_core06 = { package = "rand_core", version = "0.6", features = ["getrandom"], optional = true }
pbkdf2 = "0.13.0"
quick-xml = "0.41.0"
rand = "0.10.0"
rand_core = "0.10.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
secp256k1 = { version = "0.33.1", features = ["recovery", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
bs58 = "0.5.1"
sha2 = "0.11.0"
blake2 = "0.10.6"
subtle = "2.6.1"
bls12_381 = { version = "0.8", default-features = false, features = ["alloc", "groups", "pairings"], optional = true }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "macros", "time"] }
alloy = { version = "2.1.0", features = ["rpc-types", "rpc-client", "network", "signer-local", "provider-http", "pubsub"] }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.71"
web-sys = "0.3.102"
base64 = "0.23.0"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem"] }
cryptoki = { version = "0.12", optional = true }
webauthn-rs = { version = "0.5", optional = true }
secrecy = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_0_2 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }

[lib]
crate-type = ["cdylib", "rlib"]
