# GitLab CI is the primary free build lane; GitHub Actions is billing-locked.
stages: [test]
default:
  interruptible: true
variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
test:
  stage: test
  image: rust:1.100-bookworm
  cache:
    key: cargo-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG
    paths: [.cargo/registry, target]
  before_script:
    - apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev > /dev/null
  script:
    - cargo --version
    - cargo test --locked --lib
