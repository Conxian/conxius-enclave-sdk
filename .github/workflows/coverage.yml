name: Coverage Enforcement

on:
  push:
    branches: [ main, staged ]
  pull_request:
    branches: [ main, staged ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage Threshold (>= 70%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # Rust 1.98.1
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Enforce line coverage minimum
        run: cargo llvm-cov --locked --workspace --all-features --fail-under-lines 70 --summary-only
