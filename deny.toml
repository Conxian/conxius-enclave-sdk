[graph]
all-features = true

[advisories]
ignore = [
    "RUSTSEC-2023-0089", # atomic-polyfill is unmaintained (frost→heapless dep)
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5 timing side-channel: transitive via alloy 2.5.0→alloy-signer→elliptic-curve 0.13.8; no patched alloy release; value-bearing path (k256 0.14→elliptic-curve 0.14→crypto-bigint 0.7.10) is already patched
]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MITNFA",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0"
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ZcashFoundation/frost",
]
